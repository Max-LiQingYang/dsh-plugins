# @dsh-plugins/workflow-visualizer bundle patch: insert this package's own
# roster row. With the package installed via `dsh plugin --profile web add`,
# this patch joins the profile's config layer stack automatically — no manual
# editing of the profile's cordis.patch.yml needed.
#
# The row id must stay unique across the profile's layer stack.
- insert:
    - id: workflow-visualizer
      name: '@dsh-plugins/workflow-visualizer'
